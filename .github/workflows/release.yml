name: Release

# Releasing is driven by the version in package.json, not by a tag you have to
# remember to push: bump it, merge to main, and this publishes and tags. The
# version bump IS the release decision, and it lives in the commit that made it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two pushes in quick succession must not race each other to the registry.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      # Required for npm provenance: it is what lets npm attest this tarball
      # was built from this commit in this workflow, rather than on someone's
      # laptop. `.npmrc` sets `provenance=true`, so publishing without this
      # fails loudly instead of silently dropping the attestation.
      id-token: write
      # To push the version tag after a successful publish.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The npm bundled with Node 22 predates OIDC Trusted Publishing, which
      # needs npm >= 11.5. Without this the workflow falls back to NODE_AUTH_TOKEN
      # silently, so a repo that thinks it is tokenless would still depend on a
      # secret. Same step the sibling `next-sanctum` release uses.
      - run: npm install -g npm@latest

      - name: Has this version already been published?
        id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # `npm view` fails both when the version is missing and when the
          # package does not exist at all, which is exactly the first release.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "  $name@$version is already on npm; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "  $name@$version is not on npm; releasing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.publish == 'true'

      # The same gates every pull request faces. A release must never ship
      # something that would have been rejected on the way in.
      - run: pnpm lint
        if: steps.check.outputs.publish == 'true'

      - run: pnpm typecheck
        if: steps.check.outputs.publish == 'true'

      - run: pnpm test
        if: steps.check.outputs.publish == 'true'

      - run: pnpm build
        if: steps.check.outputs.publish == 'true'

      # Authenticates by EITHER route, whichever is configured:
      #
      #   A) Trusted Publishing (OIDC) — no secret at all. Configure at
      #      npmjs.com -> the package -> Settings -> Trusted Publisher ->
      #      GitHub Actions, repo `aliziodev/singapay-js`, workflow
      #      `release.yml`. Needs the `id-token: write` above and npm >= 11.5.
      #      Preferred: nothing to store, nothing to expire, nothing to leak.
      #
      #   B) An Automation token in the `NPM_TOKEN` secret. Needed for the
      #      FIRST publish, because a Trusted Publisher is configured on a
      #      package page and the package does not exist yet.
      #
      # `--provenance` is explicit rather than left to `.npmrc`, so the intent
      # survives someone editing that file.
      - name: Publish to npm
        if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Tagged only after the registry accepted it, so a tag never points at a
      # release that failed halfway.
      - name: Tag the released commit
        if: steps.check.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"
